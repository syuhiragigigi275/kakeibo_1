<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アクアリウム家計簿</title>
    <!-- グラフ描画ライブラリ Chart.js の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #0284c7;
            --success-color: #059669;
            --danger-color: #e11d48;
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #0f172a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #0369a1 50%, #0284c7 100%);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #e0f2fe;
            margin-bottom: 24px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .card h3 {
            color: #0369a1;
            border-bottom: 2px solid #e0f2fe;
            padding-bottom: 8px;
            margin-top: 0;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-top: 4px solid var(--primary-color);
        }

        .summary-card h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #64748b;
            border: none;
            padding: 0;
        }

        .summary-card .amount {
            font-size: 20px;
            font-weight: bold;
        }

        .account-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .account-box {
            background: #f0f9ff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #bae6fd;
            text-align: center;
        }

        .account-box .name {
            font-size: 13px;
            color: #0369a1;
            font-weight: bold;
        }

        .account-box .balance {
            font-size: 16px;
            font-weight: bold;
            margin-top: 4px;
        }

        .income-text { color: var(--success-color); }
        .expense-text { color: var(--danger-color); }

        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)) 1fr auto;
            gap: 10px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #334155;
        }

        input, select, button {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background-color: #f8fafc;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(3, 105, 161, 0.15);
        }

        button {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            background: #cbd5e1;
            color: #334155;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab-btn.active {
            background: #0284c7;
            color: white;
        }

        .filter-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        th {
            background-color: #f0f9ff;
            color: #0369a1;
            font-weight: 600;
        }

        .delete-btn {
            background: #e11d48;
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 6px;
        }

        .chart-container {
            position: relative;
            max-width: 350px;
            margin: 20px auto 0 auto;
        }

        @media (max-width: 700px) {
            form {
                grid-template-columns: 1fr;
            }
            .summary-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🐬 アクアリウム家計簿 🐠</h1>

        <!-- サマリー表示 -->
        <div class="summary-grid">
            <div class="summary-card">
                <h3>今月の収入</h3>
                <div id="total-income" class="amount income-text">¥0</div>
            </div>
            <div class="summary-card">
                <h3>今月の支出</h3>
                <div id="total-expense" class="amount expense-text">¥0</div>
            </div>
            <div class="summary-card">
                <h3>今月の収支</h3>
                <div id="balance" class="amount">¥0</div>
            </div>
        </div>

        <!-- 口座残高一覧 (複数口座対応) -->
        <div class="card">
            <h3>💳 口座・資産残高一覧</h3>
            <div id="account-list" class="account-grid">
                <!-- JavaScriptで動的挿入 -->
            </div>
        </div>

        <!-- 入力フォーム (タブ切り替え：収支 or 口座間移動) -->
        <div class="card">
            <div class="tab-buttons">
                <button class="tab-btn active" id="tab-transaction" onclick="switchTab('transaction')">収支を記録</button>
                <button class="tab-btn" id="tab-transfer" onclick="switchTab('transfer')">口座間移動 (チャージ等)</button>
            </div>

            <!-- 収支入力フォーム -->
            <form id="transaction-form">
                <div class="form-group">
                    <label for="type">区分</label>
                    <select id="type">
                        <option value="expense">支出</option>
                        <option value="income">収入</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">日付</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="account">利用口座</label>
                    <select id="account" required>
                        <!-- 動的挿入 -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="category">分類</label>
                    <select id="category">
                        <!-- 動的挿入 -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="pay-method">支払方法</label>
                    <select id="pay-method">
                        <option value="現金">現金</option>
                        <option value="クレジットカード">クレジットカード</option>
                        <option value="PayPay">PayPay</option>
                        <option value="Suica/IC">Suica/ICカード</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="memo">内容・メモ</label>
                    <input type="text" id="memo" placeholder="例: スーパー, カフェなど">
                </div>
                <div class="form-group">
                    <label for="amount">金額 (円)</label>
                    <input type="number" id="amount" placeholder="例: 1500" required min="1">
                </div>
                <button type="submit">追加する</button>
            </form>

            <!-- 口座移動フォーム (初期状態は非表示) -->
            <form id="transfer-form" style="display: none;">
                <div class="form-group">
                    <label for="transfer-date">日付</label>
                    <input type="date" id="transfer-date" required>
                </div>
                <div class="form-group">
                    <label for="from-account">移動元 (出金)</label>
                    <select id="from-account" required></select>
                </div>
                <div class="form-group">
                    <label for="to-account">移動先 (入金)</label>
                    <select id="to-account" required></select>
                </div>
                <div class="form-group">
                    <label for="transfer-memo">メモ</label>
                    <input type="text" id="transfer-memo" placeholder="例: Suicaチャージ">
                </div>
                <div class="form-group">
                    <label for="transfer-amount">金額 (円)</label>
                    <input type="number" id="transfer-amount" placeholder="例: 5000" required min="1">
                </div>
                <button type="submit">移動する</button>
            </form>
        </div>

        <!-- 分類別内訳 ＆ グラフ -->
        <div class="card">
            <h3>🌊 分類ごとの内訳（今月）</h3>
            <table>
                <thead>
                    <tr>
                        <th>区分</th>
                        <th>分類</th>
                        <th>合計金額</th>
                    </tr>
                </thead>
                <tbody id="category-summary-list"></tbody>
            </table>
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <!-- 一覧・フィルター -->
        <div class="card">
            <div class="filter-container">
                <h3>📋 履歴一覧</h3>
                <div>
                    <label for="month-filter">月選択: </label>
                    <input type="month" id="month-filter">
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>日付</th>
                        <th>区分</th>
                        <th>口座</th>
                        <th>分類 / 支払</th>
                        <th>内容</th>
                        <th>金額</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="transaction-list"></tbody>
            </table>
        </div>
    </div>

    <script>
        // ローカルストレージデータの読み込み
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        
        // 口座初期データ（ユーザーが3つの口座を持っている前提で初期設定。後で自由に変更・追加も可能）
        let accounts = JSON.parse(localStorage.getItem('accounts')) || [
            { id: 'acc1', name: '銀行口座A (メイン)', initialBalance: 100000 },
            { id: 'acc2', name: '銀行口座B (貯金)', initialBalance: 300000 },
            { id: 'acc3', name: '現金・財布', initialBalance: 15000 }
        ];

        const form = document.getElementById('transaction-form');
        const transferForm = document.getElementById('transfer-form');
        const typeInput = document.getElementById('type');
        const dateInput = document.getElementById('date');
        const transferDateInput = document.getElementById('transfer-date');
        const accountInput = document.getElementById('account');
        const fromAccountInput = document.getElementById('from-account');
        const toAccountInput = document.getElementById('to-account');
        const categoryInput = document.getElementById('category');
        const payMethodInput = document.getElementById('pay-method');
        const memoInput = document.getElementById('memo');
        const transferMemoInput = document.getElementById('transfer-memo');
        const amountInput = document.getElementById('amount');
        const transferAmountInput = document.getElementById('transfer-amount');
        
        const transactionList = document.getElementById('transaction-list');
        const categorySummaryList = document.getElementById('category-summary-list');
        const accountListEl = document.getElementById('account-list');
        const totalIncomeEl = document.getElementById('total-income');
        const totalExpenseEl = document.getElementById('total-expense');
        const balanceEl = document.getElementById('balance');
        const monthFilter = document.getElementById('month-filter');

        let expenseChart = null;

        const categories = {
            expense: ['食費', '家具', '洋服', '娯楽', '交通費', '光熱費', '家賃', '雑費', 'その他'],
            income: ['給与', '賞与', '副業', 'お小遣い', 'その他']
        };

        // 初期日付のセット
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;
        transferDateInput.value = today;
        const currentMonthStr = today.slice(0, 7);
        monthFilter.value = currentMonthStr;

        // セレクトボックスの選択肢更新
        function updateSelectOptions() {
            // 分類
            const type = typeInput.value;
            categoryInput.innerHTML = '';
            categories[type].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                categoryInput.appendChild(opt);
            });

            // 口座一覧
            accountInput.innerHTML = '';
            fromAccountInput.innerHTML = '';
            toAccountInput.innerHTML = '';
            accounts.forEach(acc => {
                const opt1 = document.createElement('option');
                opt1.value = acc.id;
                opt1.textContent = acc.name;
                accountInput.appendChild(opt1);

                const opt2 = opt1.cloneNode(true);
                fromAccountInput.appendChild(opt2);

                const opt3 = opt1.cloneNode(true);
                toAccountInput.appendChild(opt3);
            });
        }

        typeInput.addEventListener('change', updateSelectOptions);
        updateSelectOptions();

        // タブ切り替え関数
        function switchTab(mode) {
            const tabTrans = document.getElementById('tab-transaction');
            const tabTransfer = document.getElementById('tab-transfer');
            if (mode === 'transaction') {
                tabTrans.className = 'tab-btn active';
                tabTransfer.className = 'tab-btn';
                form.style.display = 'grid';
                transferForm.style.display = 'none';
            } else {
                tabTrans.className = 'tab-btn';
                tabTransfer.className = 'tab-btn active';
                form.style.display = 'none';
                transferForm.style.display = 'grid';
            }
        }

        // 収支データの追加
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const newTransaction = {
                id: Date.now(),
                isTransfer: false,
                type: typeInput.value,
                date: dateInput.value,
                accountId: accountInput.value,
                category: categoryInput.value,
                payMethod: payMethodInput.value,
                memo: memoInput.value.trim() || '-',
                amount: Number(amountInput.value)
            };
            transactions.push(newTransaction);
            saveAndRender();
            form.reset();
            dateInput.value = today;
            typeInput.value = 'expense';
            updateSelectOptions();
        });

        // 口座間移動データの追加
        transferForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const fromId = fromAccountInput.value;
            const toId = toAccountInput.value;

            if (fromId === toId) {
                alert('移動元と移動先には別の口座を選択してください。');
                return;
            }

            const newTransfer = {
                id: Date.now(),
                isTransfer: true,
                date: transferDateInput.value,
                fromId: fromId,
                toId: toId,
                memo: transferMemoInput.value.trim() || '口座間移動',
                amount: Number(transferAmountInput.value)
            };
            transactions.push(newTransfer);
            saveAndRender();
            transferForm.reset();
            transferDateInput.value = today;
            updateSelectOptions();
        });

        function saveAndRender() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
            localStorage.setItem('accounts', JSON.stringify(accounts));
            render();
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            saveAndRender();
        }

        function render() {
            transactionList.innerHTML = '';
            categorySummaryList.innerHTML = '';
            accountListEl.innerHTML = '';
            const selectedMonth = monthFilter.value;

            // 口座ごとの残高計算（初期残高 ＋ 全期間の収支・移動を反映）
            const accountBalances = {};
            accounts.forEach(acc => {
                accountBalances[acc.id] = acc.initialBalance;
            });

            // 全期間の履歴から口座残高を計算
            transactions.forEach(t => {
                if (!t.isTransfer) {
                    if (t.type === 'income') {
                        if (accountBalances[t.accountId] !== undefined) accountBalances[t.accountId] += t.amount;
                    } else {
                        if (accountBalances[t.accountId] !== undefined) accountBalances[t.accountId] -= t.amount;
                    }
                } else {
                    if (accountBalances[t.fromId] !== undefined) accountBalances[t.fromId] -= t.amount;
                    if (accountBalances[t.toId] !== undefined) accountBalances[t.toId] += t.amount;
                }
            });

            // 口座残高カードの描画
            accounts.forEach(acc => {
                const currentBal = accountBalances[acc.id] || 0;
                const box = document.createElement('div');
                box.className = 'account-box';
                box.innerHTML = `
                    <div class="name">${escapeHTML(acc.name)}</div>
                    <div class="balance ${currentBal >= 0 ? '' : 'expense-text'}">¥${currentBal.toLocaleString()}</div>
                `;
                accountListEl.appendChild(box);
            });

            // 選択月のフィルター
            const filteredTransactions = transactions.filter(t => {
                if (!selectedMonth) return true;
                return t.date.startsWith(selectedMonth);
            });

            filteredTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));

            let totalIncome = 0;
            let totalExpense = 0;
            const categoryTotals = {};

            filteredTransactions.forEach(t => {
                const tr = document.createElement('tr');
                
                if (!t.isTransfer) {
                    if (t.type === 'income') {
                        totalIncome += t.amount;
                    } else {
                        totalExpense += t.amount;
                    }

                    const key = `${t.type}_${t.category}`;
                    if (!categoryTotals[key]) {
                        categoryTotals[key] = { type: t.type, category: t.category, amount: 0 };
                    }
                    categoryTotals[key].amount += t.amount;

                    const accObj = accounts.find(a => a.id === t.accountId);
                    const accName = accObj ? accObj.name : '不明口座';

                    tr.innerHTML = `
                        <td>${t.date}</td>
                        <td><span class="${t.type === 'income' ? 'income-text' : 'expense-text'}">${t.type === 'income' ? '収入' : '支出'}</span></td>
                        <td>${escapeHTML(accName)}</td>
                        <td><b>${escapeHTML(t.category)}</b><br><small style="color:#64748b;">支払: ${escapeHTML(t.payMethod)}</small></td>
                        <td>${escapeHTML(t.memo)}</td>
                        <td class="${t.type === 'income' ? 'income-text' : 'expense-text'}">${t.type === 'income' ? '+' : '-'}¥${t.amount.toLocaleString()}</td>
                        <td><button class="delete-btn" onclick="deleteTransaction(${t.id})">削除</button></td>
                    `;
                } else {
                    // 口座移動の表示
                    const fromObj = accounts.find(a => a.id === t.fromId);
                    const toObj = accounts.find(a => a.id === t.toId);
                    const fromName = fromObj ? fromObj.name : '不明';
                    const toName = toObj ? toObj.name : '不明';

                    tr.innerHTML = `
                        <td>${t.date}</td>
                        <td><span style="color: #0284c7; font-weight: bold;">口座移動</span></td>
                        <td>-</td>
                        <td><b>${escapeHTML(fromName)} ➔ ${escapeHTML(toName)}</b></td>
                        <td>${escapeHTML(t.memo)}</td>
                        <td style="color: #0284c7;">±¥${t.amount.toLocaleString()}</td>
                        <td><button class="delete-btn" onclick="deleteTransaction(${t.id})">削除</button></td>
                    `;
                }
                transactionList.appendChild(tr);
            });

            // 分類別内訳テーブル
            const categoryValues = Object.values(categoryTotals);
            categoryValues.sort((a, b) => b.amount - a.amount);

            let chartLabels = [];
            let chartData = [];

            categoryValues.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="${item.type === 'income' ? 'income-text' : 'expense-text'}">${item.type === 'income' ? '収入' : '支出'}</span></td>
                    <td><b>${escapeHTML(item.category)}</b></td>
                    <td class="${item.type === 'income' ? 'income-text' : 'expense-text'}">¥${item.amount.toLocaleString()}</td>
                `;
                categorySummaryList.appendChild(tr);

                if (item.type === 'expense') {
                    chartLabels.push(item.category);
                    chartData.push(item.amount);
                }
            });

            const balance = totalIncome - totalExpense;
            totalIncomeEl.textContent = `¥${totalIncome.toLocaleString()}`;
            totalExpenseEl.textContent = `¥${totalExpense.toLocaleString()}`;
            balanceEl.textContent = `¥${balance.toLocaleString()}`;
            balanceEl.className = `amount ${balance >= 0 ? 'income-text' : 'expense-text'}`;

            updateChart(chartLabels, chartData);
        }

        function updateChart(labels, data) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            if (expenseChart) {
                expenseChart.destroy();
            }

            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#0284c7', '#38bdf8', '#0ea5e9', '#0369a1', '#7dd3fc', '#bae6fd', '#38bdf8', '#0284c7', '#034f84'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' },
                        title: { display: true, text: '支出の分類別割合（海洋カラー）' }
                    }
                }
            });
        }

        monthFilter.addEventListener('change', render);

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        render();
    </script>
</body>
</html>
